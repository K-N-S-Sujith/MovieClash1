server.port=${PORT:8080}

# LiveKit SFU Configuration (Override via environment variables in production)
livekit.url=${LIVEKIT_URL:wss://movieclash-demo.livekit.cloud}
livekit.api-key=${LIVEKIT_API_KEY:devkey}
livekit.api-secret=${LIVEKIT_API_SECRET:secret}

# WebSocket & Servlet Configuration
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB

# Logging Configuration
logging.level.root=INFO
logging.level.com.movieclash=INFO
logging.level.org.springframework.web.socket=INFO

