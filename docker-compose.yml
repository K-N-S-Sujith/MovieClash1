version: '3.8'

services:
  movieclash-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movieclash-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LIVEKIT_URL=wss://movieclash-demo.livekit.cloud
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  movieclash-frontend:
    image: nginx:alpine
    container_name: movieclash-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - movieclash-backend

