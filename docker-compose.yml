services:
  movieclash:
    build:
      context: .
      dockerfile: Dockerfile.local
    image: movieclash:latest
    container_name: movieclash-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LIVEKIT_URL=wss://movieclash-demo.livekit.cloud
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
